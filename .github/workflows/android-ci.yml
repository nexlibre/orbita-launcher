name: Android verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ORBITA_SIGNING_PATH: ${{ runner.temp }}/orbita-development.p12
      ORBITA_SIGNING_PASSWORD: ${{ secrets.ORBITA_DEBUG_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Restore protected development signing key
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEY: ${{ secrets.ORBITA_DEBUG_KEYSTORE_B64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          value=os.environ.get('SIGNING_KEY','')
          assert value and os.environ.get('ORBITA_SIGNING_PASSWORD'), 'Persistent signing is required.'
          path=Path(os.environ['ORBITA_SIGNING_PATH'])
          path.write_bytes(base64.b64decode(value,validate=True));path.chmod(0o600)
          PY
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Tests, lint and debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ORBITA-0.1.0-alpha.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
  android-smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ORBITA_SIGNING_PATH: ${{ runner.temp }}/orbita-development.p12
      ORBITA_SIGNING_PASSWORD: ${{ secrets.ORBITA_DEBUG_STORE_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        api: [26, 29, 33, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore protected development signing key
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEY: ${{ secrets.ORBITA_DEBUG_KEYSTORE_B64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          value=os.environ.get('SIGNING_KEY','')
          assert value and os.environ.get('ORBITA_SIGNING_PASSWORD'), 'Persistent signing is required.'
          path=Path(os.environ['ORBITA_SIGNING_PATH'])
          path.write_bytes(base64.b64decode(value,validate=True));path.chmod(0o600)
          PY
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./ci/android-acceptance.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            case-*.log
            *-activity.log
          if-no-files-found: warn
